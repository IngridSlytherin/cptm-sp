limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;
  gzip on; gzip_vary on; gzip_min_length 1024; gzip_types application/json text/css application/javascript image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
  location = /nginx-health { access_log off; return 200 "ok\n"; }
  location /api/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://api:3001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 10s; proxy_send_timeout 30s; proxy_read_timeout 30s; }
  location / { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 10s; proxy_read_timeout 30s; }
}
# Após emitir o certificado, adicione um bloco listen 443 ssl/http2 com ssl_certificate e
# ssl_certificate_key apontando para /etc/letsencrypt/live/SEU_DOMINIO/, e redirecione HTTP para HTTPS.
