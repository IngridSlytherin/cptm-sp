name: rail-status-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 5s, retries: 10}
    networks: [rail_network]
  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"], interval: 5s, timeout: 5s, retries: 10}
    networks: [rail_network]
  api:
    build: {context: ., dockerfile: infrastructure/docker/api.Dockerfile}
    environment:
      NODE_ENV: development
      API_PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60000}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-100}
      STATUS_PROVIDER: ${STATUS_PROVIDER:-mock}
      STATUS_SOURCE_URL: ${STATUS_SOURCE_URL:-}
      STATUS_SOURCE_API_KEY: ${STATUS_SOURCE_API_KEY:-}
      STATUS_COLLECTION_INTERVAL_SECONDS: ${STATUS_COLLECTION_INTERVAL_SECONDS:-300}
      STATUS_STALE_AFTER_SECONDS: ${STATUS_STALE_AFTER_SECONDS:-180}
      STATUS_REQUEST_TIMEOUT_MS: ${STATUS_REQUEST_TIMEOUT_MS:-10000}
      MOCK_STATUS_SCENARIO: ${MOCK_STATUS_SCENARIO:-normal}
      INTERNAL_COLLECTION_KEY: ${INTERNAL_COLLECTION_KEY:-}
    ports: ["${API_PORT:-3001}:3001"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: {test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/api/v1/health"], interval: 10s, timeout: 5s, retries: 10, start_period: 10s}
    networks: [rail_network]
  web:
    build: {context: ., dockerfile: infrastructure/docker/web.Dockerfile, args: {NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}", DOMAIN: "${DOMAIN:-localhost}"}}
    environment: {NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}", API_INTERNAL_URL: "http://api:3001/api/v1", DOMAIN: "${DOMAIN:-localhost}"}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"], interval: 10s, timeout: 5s, retries: 10}
    networks: [rail_network]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./infrastructure/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: {web: {condition: service_healthy}, api: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"], interval: 10s, timeout: 5s, retries: 5}
    networks: [rail_network]
volumes: {postgres_data: {}, redis_data: {}}
networks: {rail_network: {driver: bridge}}
